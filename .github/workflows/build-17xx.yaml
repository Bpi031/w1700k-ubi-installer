name: Gemtek 17xx UBI Installer

on:
  workflow_dispatch:

env:
  REMOTE_REPOSITORY: hurrian/openwrt-w1700k
  REMOTE_BRANCH: xr1710g-safe
  TARGET_SUBTARGET: airoha/an7581
  INNER_CONFIG: configs/build.config
  OUTER_CONFIG: configs/minimal.config
  # XR1710G
  DEVICE_NAME: xr1710g
  RECOVERY_FILE: openwrt-airoha-an7581-gemtek_xr1710g-ubi-initramfs-recovery.itb
  SYSUPGRADE_FILE: openwrt-airoha-an7581-gemtek_xr1710g-ubi-squashfs-sysupgrade.itb
  INSTALLER_FILE: openwrt-airoha-an7581-gemtek_xr1710g-ubi-initramfs-installer.itb
  UBOOT_FILE: openwrt-airoha-an7581-gemtek_xr1710g-ubi-chainload-uboot.itb

jobs:
  build:
    name: Build OpenWrt (xr1710g)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout installer repository
        uses: actions/checkout@main
        with:
          path: installer-repo

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Checkout OpenWrt repository
        uses: actions/checkout@main
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_BRANCH }}
          path: openwrt
          fetch-depth: 0

      - name: Update and install feeds
        run: |
          cd openwrt
          sed -i -e 's#https://git.openwrt.org/feed/#https://github.com/openwrt/#g' \
                 -e 's#https://git.openwrt.org/project/#https://github.com/openwrt/#g' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inner Build
        run: |
          cd openwrt
          cp "../installer-repo/${{ env.INNER_CONFIG }}" .config
          make defconfig
          # ==== inject BBR  ====
          sed -i '/CONFIG_PACKAGE_kmod-tcp-bbr/d' .config
          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config
          echo "CONFIG_DEFAULT_net.core.default_qdisc=\"fq\"" >> .config
          echo "CONFIG_DEFAULT_net.ipv4.tcp_congestion_control=\"bbr\"" >> .config
          make defconfig
          # ============================================
          make -j"$(nproc)" download world

      - name: Outer Build (Installer)
        run: |
          cd openwrt
          cp "../installer-repo/${{ env.OUTER_CONFIG }}" .config
          make defconfig
          mkdir -p files/installer
          cp "bin/targets/${{ env.TARGET_SUBTARGET }}/${{ env.RECOVERY_FILE }}" "files/installer/"
          cp "bin/targets/${{ env.TARGET_SUBTARGET }}/${{ env.SYSUPGRADE_FILE }}" "files/installer/"
          rsync -a ../installer-repo/files/ files/
          chmod +x files/installer/install.sh files/lib/preinit/00_installer
          make -j"$(nproc)"

      - name: Prepare and Rename Artifacts
        run: |
          mkdir -p output/
          cp "openwrt/bin/targets/${{ env.TARGET_SUBTARGET }}/${{ env.RECOVERY_FILE }}" "output/${{ env.INSTALLER_FILE }}"
          cp "openwrt/bin/targets/${{ env.TARGET_SUBTARGET }}/${{ env.UBOOT_FILE }}" "output/${{ env.UBOOT_FILE }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: xr1710g-installer
          path: output/
